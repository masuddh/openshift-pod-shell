<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenShift Pod Terminal - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>OpenShift Pod Terminal</h1>
      <p class="cluster-info">Connected to: <strong>OCP Dev Jakarta</strong></p>
      
      <!-- Auth method toggle -->
      <div class="auth-tabs">
        <button class="tab-btn active" data-tab="token">Token</button>
        <button class="tab-btn" data-tab="password">Username/Password</button>
      </div>

      <form id="loginForm">
        <!-- Token authentication (default) -->
        <div id="tokenAuth" class="auth-method">
          <div class="form-group">
            <label for="token">Access Token</label>
            <input type="password" id="token" placeholder="Paste your token here" autofocus>
            <small>Get your token with: <code>oc whoami -t</code></small>
          </div>
        </div>

        <!-- Username/Password authentication -->
        <div id="passwordAuth" class="auth-method" style="display: none;">
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter your username">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter your password">
          </div>
        </div>

        <button type="submit" class="btn-primary">Login</button>
        <div id="error" class="error-message"></div>
      </form>
    </div>
  </div>

  <style>
    .cluster-info {
      text-align: center;
      color: #666;
      margin: -10px 0 20px 0;
      font-size: 14px;
    }
    .cluster-info strong {
      color: #0066cc;
    }
    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      background: #f5f5f5;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: #0066cc;
      color: white;
      border-color: #0066cc;
    }
    .auth-method {
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>

  <script>
    // Predefined OpenShift cluster URL
    const OPENSHIFT_URL = 'https://api.ocpdev-jkt.adira.co.id:6443';
    
    // Auto-detect API URL based on environment
    const API_URL = window.location.hostname === 'localhost' 
      ? 'http://localhost:3001'
      : `${window.location.protocol}//${window.location.host}/pod-shell`;
    
    let currentAuthMethod = 'token';

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        currentAuthMethod = tab;
        
        // Update active tab
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // Show/hide auth methods
        document.getElementById('tokenAuth').style.display = tab === 'token' ? 'block' : 'none';
        document.getElementById('passwordAuth').style.display = tab === 'password' ? 'block' : 'none';
        
        // Clear error
        document.getElementById('error').textContent = '';
      });
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const errorDiv = document.getElementById('error');
      errorDiv.textContent = '';
      
      let requestBody = { openshiftUrl: OPENSHIFT_URL };

      if (currentAuthMethod === 'token') {
        const token = document.getElementById('token').value;
        if (!token) {
          errorDiv.textContent = 'Please enter your access token';
          return;
        }
        requestBody.token = token;
      } else {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        if (!username || !password) {
          errorDiv.textContent = 'Please enter username and password';
          return;
        }
        requestBody.username = username;
        requestBody.password = password;
      }

      try {
        const response = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        if (!response.ok) {
          const error = await response.json();
          let errorMsg = error.error || 'Login failed';
          if (error.suggestion) {
            errorMsg += '\n' + error.suggestion;
          }
          throw new Error(errorMsg);
        }

        const data = await response.json();
        
        // Store session
        localStorage.setItem('sessionId', data.sessionId);
        localStorage.setItem('openshiftUrl', data.openshiftUrl);
        
        // Redirect to terminal
        window.location.href = 'index.html';
      } catch (error) {
        errorDiv.textContent = error.message;
      }
    });

    // Check if already logged in
    if (localStorage.getItem('sessionId')) {
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
