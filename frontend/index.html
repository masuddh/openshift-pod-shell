<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenShift Pod Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <div class="header">
      <h1>OpenShift Pod Terminal</h1>
      <button id="logoutBtn" class="btn-secondary">Logout</button>
    </div>

    <div class="controls">
      <div class="control-group">
        <label for="namespace">Namespace:</label>
        <select id="namespace">
          <option value="">-- Select Namespace --</option>
        </select>
      </div>

      <div class="control-group">
        <label for="pod">Pod:</label>
        <select id="pod" disabled>
          <option value="">-- Select Pod --</option>
        </select>
      </div>

      <div class="control-group">
        <label for="container">Container:</label>
        <select id="container" disabled>
          <option value="">-- Select Container --</option>
        </select>
      </div>

      <button id="connectBtn" class="btn-primary" disabled>Connect</button>
      <button id="disconnectBtn" class="btn-danger" disabled>Disconnect</button>
      <span id="status" class="status"></span>
    </div>

    <div id="terminal"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script src="app.js"></script>
</body>
</html>
