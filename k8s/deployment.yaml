---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-pod-shell-backend
  namespace: borneo-dev-apps
  labels:
    app: openshift-pod-shell
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshift-pod-shell
      component: backend
  template:
    metadata:
      labels:
        app: openshift-pod-shell
        component: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/masuddh/openshift-pod-shell-backend:latest
        ports:
        - containerPort: 3001
          name: http
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: openshift-pod-shell-backend
  namespace: borneo-dev-apps
  labels:
    app: openshift-pod-shell
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  selector:
    app: openshift-pod-shell
    component: backend

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openshift-pod-shell-frontend
  namespace: borneo-dev-apps
  labels:
    app: openshift-pod-shell
    component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openshift-pod-shell
      component: frontend
  template:
    metadata:
      labels:
        app: openshift-pod-shell
        component: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/masuddh/openshift-pod-shell-frontend:latest
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: openshift-pod-shell-frontend
  namespace: borneo-dev-apps
  labels:
    app: openshift-pod-shell
    component: frontend
spec:
  type: ClusterIP
  ports:
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: http
  selector:
    app: openshift-pod-shell
    component: frontend
